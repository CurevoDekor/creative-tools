<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Creative Tools Hub</title>

<style>

body{
font-family:Arial;
background:#f0f2f5;
text-align:center;
padding:40px;
}

h1{
color:#222;
}

.tool{
background:white;
padding:25px;
margin:25px auto;
max-width:600px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

button{
padding:10px 20px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

.result{
font-size:22px;
margin-top:15px;
color:#6b3df0;
}

textarea{
width:90%;
height:120px;
margin-top:10px;
}

</style>

</head>

<body>

<h1>Creative Tools Hub</h1>
<p>Free online generators for writers, gamers and creators.</p>

<div class="tool">

<h2>Fantasy Name Generator</h2>
<button onclick="fantasyName()">Generate</button>
<div id="fantasy" class="result"></div>

</div>

<div class="tool">

<h2>Dragon Name Generator</h2>
<button onclick="dragonName()">Generate</button>
<div id="dragon" class="result"></div>

</div>

<div class="tool">

<h2>Story Idea Generator</h2>
<button onclick="storyIdea()">Generate Idea</button>
<div id="story" class="result"></div>

</div>

<div class="tool">

<h2>Random Character Generator</h2>
<button onclick="characterGen()">Generate Character</button>
<div id="character" class="result"></div>

</div>

<div class="tool">

<h2>Password Generator</h2>
<button onclick="passwordGen()">Generate Password</button>
<div id="password" class="result"></div>

</div>

<div class="tool">

<h2>Word Counter</h2>
<textarea id="text" oninput="countWords()"></textarea>
<p id="wordcount">Words: 0</p>

</div>

<script>

function random(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

function fantasyName(){

let start=["Ar","Bel","Vor","Kal","Mor","Vel","Zan","Tor","Eld","Syl"];
let end=["dor","mir","th","nar","ion","dras","veth","lor","rian","dell"];

document.getElementById("fantasy").innerText=random(start)+random(end);

}

function dragonName(){

let start=["Drak","Zor","Thar","Vyr","Krath","Rax","Ign","Pyro"];
let end=["gor","thar","nix","rax","zor","drake","thos"];

document.getElementById("dragon").innerText=random(start)+random(end);

}

function storyIdea(){

let ideas=[

"A hidden city appears once every 100 years.",
"A dragon guards a forgotten library.",
"A robot begins to dream about freedom.",
"A traveler finds a portal to another world.",
"A mysterious book predicts the future.",
"A kingdom disappears overnight.",
"A scientist invents a machine that reads memories."

];

document.getElementById("story").innerText=random(ideas);

}

function characterGen(){

let roles=["warrior","mage","thief","explorer","scientist","knight","merchant"];
let traits=["brave","cunning","curious","mysterious","lonely","rebellious","wise"];
let goals=["seeking revenge","searching for treasure","trying to save a kingdom","looking for lost knowledge"];

document.getElementById("character").innerText=

"A "+random(traits)+" "+random(roles)+" "+random(goals)+".";

}

function passwordGen(){

let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%";
let pass="";

for(let i=0;i<12;i++){

pass+=chars[Math.floor(Math.random()*chars.length)];

}

document.getElementById("password").innerText=pass;

}

function countWords(){

let text=document.getElementById("text").value.trim();

if(text===""){

document.getElementById("wordcount").innerText="Words: 0";
return;

}

let words=text.split(/\s+/);

document.getElementById("wordcount").innerText="Words: "+words.length;

}

</script>

</body>

</html>
